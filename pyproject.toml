[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entrardp"
version = "0.1.0"
description = "GUI for FreeRDP connections to Entra ID (Azure AD) joined Windows hosts"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["PyQt6>=6.4"]

[project.urls]
Homepage = "https://github.com/themew2/FreeRDP-to-Entra-Connected-Windows-Device"
Issues = "https://github.com/themew2/FreeRDP-to-Entra-Connected-Windows-Device/issues"

[project.scripts]
entrardp = "entrardp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
entrardp = ["data/*.svg", "data/*.png"]

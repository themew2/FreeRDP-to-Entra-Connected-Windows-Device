# Flatpak manifest for Entra RDP.
#
# STATUS: needs reconciling with upstream before Flathub submission.
#
# FreeRDP ships its own manifest at packaging/flatpak/com.freerdp.FreeRDP.json,
# built on org.freedesktop.Platform 24.08, and it is actively maintained. The
# FreeRDP module definitions below duplicate that work and will drift from it.
# Prefer copying upstream's freerdp/SDL module definitions into this file and
# adding only WITH_WEBVIEW/WITH_AAD/WITH_SSO_MIB on top.
#
# Runtime choice is the open question. FreeRDP's webview helper needs WebKitGTK,
# which the GNOME runtime ships and the KDE runtime does not; upstream uses the
# freedesktop runtime, so confirm how they satisfy WebKitGTK there before
# settling on GNOME. Qt currently arrives via the PyQt BaseApp extension.
#
# Build locally with:
#   flatpak install -y flathub org.gnome.Sdk//48 org.gnome.Platform//48 \
#       com.riverbankcomputing.PyQt.BaseApp//6.7
#   flatpak-builder --user --install --force-clean build-dir \
#       packaging/flatpak/io.github.themew2.EntraRDP.yml

app-id: io.github.themew2.EntraRDP
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.7'
command: entrardp

finish-args:
  # Display and input
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  # RDP is a network client, and sign-in reaches Microsoft endpoints
  - --share=network
  # Audio in and out for /sound and /microphone redirection
  - --socket=pulseaudio
  # Printer redirection
  - --socket=cups
  # Drive redirection: the user picks a folder, so use the portal rather than
  # blanket filesystem access
  - --filesystem=xdg-documents
  - --filesystem=xdg-download

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

modules:
  # ------------------------------------------------------------------
  # SDL3 and its helpers, needed by the FreeRDP SDL client.
  # ------------------------------------------------------------------
  - name: sdl3
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_TEST_LIBRARY=OFF
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL.git
        tag: release-3.2.0

  - name: sdl3-ttf
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL_ttf.git
        tag: release-3.1.0

  - name: sdl3-image
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL_image.git
        tag: release-3.2.0

  # ------------------------------------------------------------------
  # FreeRDP. WITH_WEBVIEW=ON is the entire point of this package: it is
  # what distro builds omit, and what makes native Entra sign-in work.
  # ------------------------------------------------------------------
  - name: freerdp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DWITH_WEBVIEW=ON
      - -DWITH_AAD=ON
      # Automatic token retrieval where a local SSO broker is present
      - -DWITH_SSO_MIB=ON
      - -DWITH_CLIENT_SDL=ON
      - -DWITH_CLIENT_SDL3=ON
      - -DWITH_CLIENT_SDL2=OFF
      - -DWITH_PULSE=ON
      - -DWITH_X11=ON
      - -DWITH_WAYLAND=ON
      - -DWITH_FFMPEG=ON
      - -DWITH_CUPS=ON
      - -DWITH_SERVER=OFF
      - -DWITH_SHADOW=OFF
      - -DWITH_PROXY=OFF
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://github.com/FreeRDP/FreeRDP.git
        # PLACEHOLDER - must be updated before any submission.
        # Must be >= 3.16.0 (the release that introduced WITH_WEBVIEW).
        # FreeRDP master reported 3.30.1-dev0 in August 2026, so pick the
        # newest stable tag at packaging time rather than trusting this value.
        tag: 3.30.0

  # ------------------------------------------------------------------
  # The application itself.
  # ------------------------------------------------------------------
  - name: entrardp
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
      - install -Dm644 data/io.github.themew2.EntraRDP.desktop
        /app/share/applications/io.github.themew2.EntraRDP.desktop
      - install -Dm644 data/io.github.themew2.EntraRDP.metainfo.xml
        /app/share/metainfo/io.github.themew2.EntraRDP.metainfo.xml
      - install -Dm644 data/icons/io.github.themew2.EntraRDP.svg
        /app/share/icons/hicolor/scalable/apps/io.github.themew2.EntraRDP.svg
    sources:
      - type: dir
        path: ../..
